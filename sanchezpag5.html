  <style>
    body {
      background: linear-gradient(135deg, #1c1c1c, #3a3a3a);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: white;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      background: #000 !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    /* TITULO */
    h2 {
      text-align: center;
      margin: 40px 0 30px 0;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* CONTENEDOR DEL FORMULARIO (ESTILO OSCURO PREMIUM) */
    .form-container {
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 40px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }

    .form-control, .form-control:focus {
      background: #252525;
      border: 1px solid #444;
      color: white;
    }

    .form-control:focus {
      border-color: #00c3ff;
      box-shadow: 0 0 0 0.2rem rgba(0, 195, 255, 0.25);
    }

    select.form-control option {
      background: #252525;
      color: white;
    }

    /* BOTON FORMULARIO */
    .btn-primary {
      background: #00c3ff;
      border: none;
      color: black;
      font-weight: bold;
      border-radius: 20px;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background: #00ffae;
      color: black;
      transform: translateY(-2px);
    }

    /* BUSCADOR NAVBAR */
    .btn-outline-success {
      border-radius: 20px;
      border-color: #00c3ff;
      color: #00c3ff;
    }

    .btn-outline-success:hover {
      background: #00c3ff;
      color: black;
      border-color: #00c3ff;
    }

    /* LINKS FOOTER */
    footer a {
      color: white;
      text-decoration: none;
      transition: 0.2s;
      margin: 0 10px;
      font-weight: bold;
    }

    footer a:hover {
      color: #00c3ff;
      text-decoration: none;
    }

    /* FOOTER */
    footer {
      background: #000;
      padding: 25px 0;
      margin-top: 50px;
    }

    /* BANNER */
    img.banner {
      width: 100%;
      height: 350px;
      object-fit: cover;
    }
  </style>
</head>
